<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sun Son Solar - Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #f5a900;
            font-size: 30px;
        }

        .logo p {
            color: #777;
            margin-top: 5px;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-group {
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #f5a900;
        }

        .terms {
            font-size: 13px;
            margin: 15px 0;
            color: #666;
        }

        .terms input {
            margin-right: 5px;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            background: #ffb300;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #e69d00;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #ff9f00;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="logo">
        <h1>☀ Sun Son Solar</h1>
        <p>Solar Energy Solutions</p>
    </div>

    <h2>Create Account</h2>

    <form id="registerForm">

        <div class="input-group">
            <label>Full Name</label>
            <input
                type="text"
                id="fullname"
                placeholder="Enter your full name"
                required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="09XXXXXXXXX"
                required>
        </div>

        <div class="input-group">
            <label>Address</label>
            <input
                type="text"
                id="address"
                placeholder="Enter your address"
                required>
        </div>

        <div class="input-group">
            <label>Username</label>
            <input
                type="text"
                id="username"
                placeholder="Create a username"
                required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required>
        </div>

        <div class="terms">
            <label>
                <input type="checkbox" id="terms">
                I agree to the Terms and Conditions
            </label>
        </div>

        <button type="submit" class="register-btn">
            REGISTER
        </button>

        <div id="message"></div>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let fullname = document.getElementById("fullname").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let address = document.getElementById("address").value;
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;
    let terms = document.getElementById("terms").checked;

    let message = document.getElementById("message");

    if (password !== confirmPassword) {

        message.style.color = "red";
        message.innerHTML = "Passwords do not match!";
        return;

    }

    if (!terms) {

        message.style.color = "red";
        message.innerHTML = "Please agree to the Terms and Conditions.";
        return;

    }

    if (password.length < 6) {

        message.style.color = "red";
        message.innerHTML = "Password must be at least 6 characters.";
        return;

    }

    // Save registration temporarily
    let user = {
        fullname: fullname,
        email: email,
        phone: phone,
        address: address,
        username: username,
        password: password
    };

    localStorage.setItem("sunsonUser", JSON.stringify(user));

    message.style.color = "green";
    message.innerHTML = "Registration successful!";

    setTimeout(function() {
        window.location.href = "login.html";
    }, 1500);

});

</script>

</body>
</html>
